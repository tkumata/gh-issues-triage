[package]
name = "gh-issues-triage"
version = "0.1.18"
edition = "2024"
rust-version = "1.100"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
keyring = "4.2.0"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "query",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
