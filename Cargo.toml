[package]
name = "gh-issues-triage"
version = "0.1.1"
edition = "2024"

[dependencies]
keyring = "4.2.0"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "query",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
