name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: version
        name: Check version and existing release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          def cargo_version(contents):
              return tomllib.loads(contents.decode())["package"]["version"]

          def parse_version(value):
              match = re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
                  r"(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?",
                  value,
              )
              if match is None:
                  raise SystemExit(f"Unsupported Cargo package version: {value}")
              core = tuple(int(part) for part in match.groups()[:3])
              prerelease = match.group(4)
              if prerelease is None:
                  return core, None
              identifiers = []
              for identifier in prerelease.split("."):
                  if not identifier or not re.fullmatch(r"[0-9A-Za-z-]+", identifier):
                      raise SystemExit(f"Invalid prerelease version: {value}")
                  if identifier.isdigit():
                      if len(identifier) > 1 and identifier.startswith("0"):
                          raise SystemExit(f"Invalid prerelease version: {value}")
                      identifiers.append((0, int(identifier)))
                  else:
                      identifiers.append((1, identifier))
              return core, tuple(identifiers)

          current = cargo_version(open("Cargo.toml", "rb").read())
          if os.environ["EVENT_NAME"] == "push":
              before = os.environ["EVENT_BEFORE"]
              if not before or set(before) == {"0"}:
                  raise SystemExit("Cannot compare Cargo.toml with the previous commit")
              previous_file = subprocess.check_output(
                  ["git", "show", f"{before}:Cargo.toml"]
              )
              previous = cargo_version(previous_file)
              current_key = parse_version(current)
              previous_key = parse_version(previous)
              if current_key[0] < previous_key[0]:
                  increased = False
              elif current_key[0] > previous_key[0]:
                  increased = True
              elif current_key[1] is None:
                  increased = previous_key[1] is not None
              elif previous_key[1] is None:
                  increased = False
              else:
                  increased = current_key[1] > previous_key[1]
              if not increased:
                  print(f"Cargo version did not increase ({previous} -> {current}); skipping release")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"release=false\nversion={current}\ntag=v{current}\n")
                  raise SystemExit(0)

          tag = f"v{current}"
          tag_check = subprocess.run(
              ["git", "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{tag}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          )
          if tag_check.returncode not in (0, 2):
              raise SystemExit(f"Could not check remote tag {tag} (git ls-remote exited {tag_check.returncode})")
          tag_exists = tag_check.returncode == 0
          should_release = not tag_exists
          if not should_release:
              print(f"{tag} already exists as a tag; skipping")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release={str(should_release).lower()}\nversion={current}\ntag={tag}\n")
          PY

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-aarch64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="gh-issues-triage-v${VERSION}-${PLATFORM}.tar.gz"
          tar -czf "$archive" -C target/release gh-issues-triage

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: gh-issues-triage-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes ./*.tar.gz
